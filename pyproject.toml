[tool.poetry]
name = "ilpostcast"
version = "0.1.0"
description = "Fetches il Post podcasts from its API and serves them as RSS feeds"
authors = ["michele <mciccozz@gmail.com>"]
readme = "README.md"

# requirements.txt (used by the Docker images) is generated from poetry.lock:
#   poetry export -f requirements.txt --without-hashes --only main -o requirements.txt
[tool.poetry.dependencies]
python = "^3.12"
requests = "^2.34"
arrow = "^1.4"
flask = "^3.1"
gunicorn = "^27.0"
icecream = "^2.2"

[tool.poetry.group.dev.dependencies]
debugpy = "^1.8"
pytest = "^9.2"

# Run with: poetry run pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["ilpostcast", "tests"]  # the modules import each other as top-level names


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
